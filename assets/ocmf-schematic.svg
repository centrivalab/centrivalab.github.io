<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="28" fill="#F4F8FC"/>
  <rect x="42" y="42" width="1116" height="636" rx="26" fill="white" stroke="#D9E4EF" stroke-width="2"/>

  <!-- Title -->
  <text x="86" y="112" fill="#0B2239" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Orthogonal Centrifugal Membrane Filter (O-CMF)</text>
  <text x="86" y="152" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="20">A compact workflow for NF, RO and OSN membrane screening in standard laboratory centrifuges.</text>

  <!-- CARD 1: Load sample (x=86, center=226) -->
  <rect x="86" y="200" width="280" height="360" rx="24" fill="#F3F9FF" stroke="#D8EAF8" stroke-width="2"/>
  <circle cx="226" cy="296" r="68" fill="#123B60"/>
  <rect x="181" y="243" width="90" height="106" rx="22" fill="#34B4FF"/>
  <rect x="192" y="255" width="68" height="15" rx="7" fill="#BCEBFF"/>
  <text x="226" y="412" fill="#0B2239" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">1. Load sample</text>
  <text x="226" y="448" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Feed solution and membrane coupon</text>
  <text x="226" y="474" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">are assembled in the cartridge</text>
  <text x="226" y="500" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">for screening.</text>

  <!-- Arrow 1→2 -->
  <path d="M374 380H446" stroke="#34B4FF" stroke-width="10" stroke-linecap="round"/>
  <path d="M424 354L458 380L424 406" stroke="#34B4FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- CARD 2: Spin (x=460, center=600) -->
  <rect x="460" y="200" width="280" height="360" rx="24" fill="#F3F9FF" stroke="#D8EAF8" stroke-width="2"/>
  <circle cx="600" cy="296" r="90" fill="#123B60"/>
  <circle cx="600" cy="296" r="62" fill="#1A527F"/>
  <rect x="578" y="234" width="44" height="124" rx="22" fill="#89E7FF"/>
  <!-- Rotation arc top-right -->
  <path d="M638 234 A54 54 0 0 1 654 296" stroke="#34B4FF" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M650 278L654 296L638 288" stroke="#34B4FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Rotation arc bottom-left -->
  <path d="M562 358 A54 54 0 0 1 546 296" stroke="#34B4FF" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M550 314L546 296L562 304" stroke="#34B4FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="600" y="412" fill="#0B2239" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">2. Spin</text>
  <text x="600" y="448" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Centrifugal acceleration generates</text>
  <text x="600" y="474" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">the hydrostatic pressure needed</text>
  <text x="600" y="500" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">for permeation.</text>

  <!-- Arrow 2→3 -->
  <path d="M748 380H820" stroke="#34B4FF" stroke-width="10" stroke-linecap="round"/>
  <path d="M798 354L832 380L798 406" stroke="#34B4FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- CARD 3: Compare (x=834, center=974) — same width as others -->
  <rect x="834" y="200" width="280" height="360" rx="24" fill="#F3F9FF" stroke="#D8EAF8" stroke-width="2"/>
  <circle cx="974" cy="296" r="68" fill="#123B60"/>
  <!-- Bar chart icon -->
  <rect x="940" y="276" width="22" height="44" rx="5" fill="#34B4FF"/>
  <rect x="968" y="254" width="22" height="66" rx="5" fill="#89E7FF"/>
  <rect x="996" y="264" width="22" height="56" rx="5" fill="#34B4FF"/>
  <!-- Baseline -->
  <path d="M934 322H1022" stroke="#BCEBFF" stroke-width="3" stroke-linecap="round"/>
  <text x="974" y="412" fill="#0B2239" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">3. Compare</text>
  <text x="974" y="448" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Flux, permeate volume</text>
  <text x="974" y="474" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">and rejection across</text>
  <text x="974" y="500" fill="#5B748C" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">membranes.</text>
</svg>
